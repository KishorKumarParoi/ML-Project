version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: student-performance-ml:latest
    container_name: student-performance-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FLASK_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ml-net

networks:
  ml-net:
    driver: bridge
